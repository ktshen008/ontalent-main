  <text x="74" y="325" font-family="Inter, Arial, sans-serif" font-size="70" font-weight="800" fill="#14201f">OnTalent</text>
  <text x="74" y="405" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="700" fill="#14201f">Innovators. Leaders. Creators.</text>
  <text x="76" y="472" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="500" fill="#5f6f6b">STEM, robotics, AI, medicine, leadership, and entrepreneurship.</text>
