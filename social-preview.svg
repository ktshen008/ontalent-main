<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">OnTalent Youth Innovation Network</title>
  <desc id="desc">Social preview graphic for the OnTalent innovation-network website concept.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f6f7f2"/>
      <stop offset="0.52" stop-color="#e9f0ef"/>
      <stop offset="1" stop-color="#dfeaf0"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" x2="1">
      <stop offset="0" stop-color="#007f7a"/>
      <stop offset="1" stop-color="#2569a8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="990" cy="110" r="210" fill="#d59a20" opacity="0.14"/>
  <circle cx="180" cy="130" r="250" fill="#007f7a" opacity="0.13"/>
  <g fill="none" stroke-linecap="round" stroke-width="3" opacity="0.42">
    <path d="M760 320 C845 215 930 170 1015 145" stroke="#007f7a" stroke-dasharray="12 16"/>
    <path d="M760 320 C890 310 980 365 1070 450" stroke="#2569a8" stroke-dasharray="12 16"/>
